baseURL = "https://pebble.debuginn.com/"
languageCode = "en-us"
title = "Pebble"
theme = "hugo-theme-pebble"
defaultContentLanguage = "en"
enableRobotsTXT = true

[taxonomies]
tag = "tags"

[params.i18n]
defaultLang = "en"

[params.theme]
version = "v1.1.0"

[params.assets]
brandName = "iAssets"
logo = "/assets/pebble-light.svg"
logoDark = "/assets/pebble-dark.svg"
logoAlt = "iAssets logo"
downloadQr = "/assets/qr-download.png"
version = "example-v1.1.0"

[params.contact]
email = "hello@example.com"

[params.social]
wechatQr = "/assets/qr-download.png"
x = "https://x.com/example"
telegram = "https://t.me/example"
xiaohongshu = "https://www.xiaohongshu.com/user/profile/example"
weibo = "https://weibo.com/example"
zhihu = "https://www.zhihu.com/people/example"

[params.seo]
# Social and JSON-LD images use siteURL when it is absolute, then baseURL.
# Canonical, og:url, hreflang, and the sitemap URL come from the page permalink.
siteURL = "https://pebble.debuginn.com"
defaultSocialTitle = "Pebble"
# Default is false (index,follow plus large-preview snippet directives).
# true emits noindex,nofollow on every page. The 404 page always stays noindex,follow.
noindex = true
# Optional Apple App Store numeric ID. When set, every page emits
# <meta name="apple-itunes-app" content="app-id=...">. Unset emits nothing.
# appleAppID = "1234567890"
# Homepage JSON-LD is a MobileApplication (iOS, FinanceApplication).
# offers use [params.pricing] yearly/lifetime and currencyCode (ISO 4217).
# The display symbol currency is not used in JSON-LD. Offers are omitted
# when currencyCode is unset. image uses the logo; screenshot uses
# home.hero.fanImages; installUrl uses home.download.ctaHref.
# Fields without a configured value are omitted.

[params.fonts]
# google (default) loads fonts.googleapis.com, except on zh-Hans pages.
# custom loads cssURL (mirror or self-hosted CSS) and preconnects only if that URL is external.
# none uses the system font stack and emits no font request.
# provider = "google"
# cssURL = "https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"

# Optional brand colors. Unset keeps the theme defaults.
# primary: buttons, fills, and the start of the hero/button gradient.
# secondary: links, accent text, and the end of that gradient.
# onPrimary: text on primary buttons. Omit to keep white.
[params.colors.light]
primary = "#1f4f86"
secondary = "#237380"
onPrimary = "#ffffff"

[params.colors.dark]
primary = "#5bb5c4"
secondary = "#7cc8d4"
onPrimary = "#0a1220"

[params.pricing]
currency = "$"
# ISO 4217 code for JSON-LD priceCurrency. The symbol above is display-only.
currencyCode = "USD"
yearly = "29"
lifetime = "99"

[params.copyright]
year = "2026"
# Optional ICP / 公安备案 (only rendered on the Simplified Chinese site)
# icp = "京ICP备12345678号-1"
# publicSecurityCode = "11010502030143"
# publicSecurityText = "京公网安备 11010502030143号"

